name: Market Stress Index

on:
  schedule:
    # every 6 hours (00:40, 06:40, 12:40, 18:40 UTC). Cboe posts the day's VIX and VVIX closes in the
    # evening ET and ICE's MOVE can land later still, so the 00:40 run normally picks up the US close
    # and the 06:40 / 12:40 runs catch any late file. The script only publishes complete sessions.
    - cron: "40 */6 * * *"
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: market-stress
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compute the Market Stress Index
        run: python3 scripts/market_stress_publish.py docs/market-stress.json
      - name: Commit the new reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market-stress.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market-stress.json $(date -u +%F)"
          git pull --rebase
          git push
