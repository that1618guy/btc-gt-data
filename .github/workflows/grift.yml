name: Grift Index

on:
  schedule:
    # every 6 hours (00:20, 06:20, 12:20, 18:20 UTC). DefiLlama posts the previous day's
    # numbers somewhere between ~6 and ~13 hours after midnight UTC, so one fixed early run
    # always lands a day behind. Running every 6 hours picks up the new day within hours.
    - cron: "20 */6 * * *"
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compute the Grift Index
        run: python3 scripts/grift_publish.py docs/grift.json
      - name: Commit the new reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grift.json
          git diff --cached --quiet && exit 0
          git commit -m "Update grift.json $(date -u +%F)"
          git pull --rebase
          git push
